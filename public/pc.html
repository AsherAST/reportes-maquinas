<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes Máquinas - PC</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>if(!window.io){document.write('<script src="/socket.io/socket.io.js"><\/script>')}</script>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
  header{background:#0f172a;color:#fff;padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:20px;margin:0}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  .pair{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  input{padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:16px}
  button{padding:12px 18px;border-radius:10px;border:none;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;font-size:15px}
  button.sec{background:#e2e8f0;color:#0f172a}
  #estado{margin:8px 0;color:#047857;font-weight:600}
  .reporte{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .reporte.nuevo{border:2px solid #22c55e;animation:flash 2s}
  @keyframes flash{0%{background:#dcfce7}}
  .meta{font-size:13px;color:#64748b;margin-bottom:8px}
  .texto{font-size:16px;white-space:pre-wrap}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .codigo-grande{font-size:28px;font-weight:900;letter-spacing:2px;background:#fff;padding:4px 14px;border-radius:10px}
  small{color:#94a3b8}
</style>
</head>
<body>
<header>
  <h1>🖥️ Reportes de Máquinas - PC</h1>
  <div class="codigo-grande" id="codigoShow">—</div>
</header>
<div class="wrap">
  <p>1. Escribe un código de apareamiento (ej: <b>PLANTA-123</b>).<br>2. Escribe <b>el mismo código</b> en el celular.<br>3. Los reportes llegan solos aquí.</p>
  <div class="pair">
    <input id="codigo" placeholder="Código ej: PLANTA-123" style="flex:1;min-width:200px" />
    <button id="conectar">🔗 Aparear</button>
    <button id="exportar" class="sec">⬇️ Exportar CSV</button>
    <button id="qr" class="sec">📱 Ver link móvil</button>
  </div>
  <div id="linkMovil" style="display:none;background:#fff;padding:12px;border-radius:10px;margin-bottom:12px;word-break:break-all"></div>
  <div id="estado">Sin conectar</div>
  <div class="top"><h2 style="margin:8px 0">Reportes recibidos (<span id="count">0</span>)</h2></div>
  <div id="lista"></div>
  <small>Tip: deja esta página abierta. Suena una alerta al llegar un reporte.</small>
</div>

<script>
const socket = io();
const codigoEl = document.getElementById('codigo');
const codigoShow = document.getElementById('codigoShow');
const estadoEl = document.getElementById('estado');
const listaEl = document.getElementById('lista');
const countEl = document.getElementById('count');
let CODIGO = localStorage.getItem('codigo-pc') || 'PLANTA-123';
codigoEl.value = CODIGO;

function conectar(){
  CODIGO = codigoEl.value.toUpperCase().trim() || 'PLANTA-123';
  localStorage.setItem('codigo-pc', CODIGO);
  codigoShow.textContent = CODIGO;
  socket.emit('unirse', CODIGO);
  estadoEl.textContent = '✅ Apareado con código ' + CODIGO + ' — esperando reportes...';
  cargarHistorial();
}
document.getElementById('conectar').onclick = conectar;

async function cargarHistorial(){
  try{
    const r = await fetch('/api/reportes/' + encodeURIComponent(CODIGO));
    const data = await r.json();
    // evita duplicados: reconstruye solo si cambió el conteo
    const ids = new Set([...listaEl.children].map(c => c.dataset.id));
    let nuevos = 0;
    // la API devuelve ordenados, los más nuevos primero; agregamos los que falten
    [...data].reverse().forEach(rep => {
      if(!ids.has(rep.id)){ pintarConId(rep, false); nuevos++; }
    });
    if(listaEl.children.length === 0){
      listaEl.innerHTML = '';
      data.forEach(rep => pintarConId(rep, false));
    }
    countEl.textContent = listaEl.children.length;
  }catch(e){}
}

function pintarConId(rep, esNuevo=false){
  const div = document.createElement('div');
  div.dataset.id = rep.id;
  div.className = 'reporte' + (esNuevo ? ' nuevo' : '');
  div.innerHTML = `<div class="meta">🏭 <b>${esc(rep.maquina)}</b> • 👷 ${esc(rep.operario)} • 🕒 ${esc(rep.fechaHora)}</div>
  <div class="texto">${esc(rep.texto)}</div>`;
  listaEl.prepend(div);
  countEl.textContent = listaEl.children.length;
}

function pintar(rep, esNuevo=false){
  const div = document.createElement('div');
  div.className = 'reporte' + (esNuevo ? ' nuevo' : '');
  div.innerHTML = `<div class="meta">🏭 <b>${esc(rep.maquina)}</b> • 👷 ${esc(rep.operario)} • 🕒 ${esc(rep.fechaHora)}</div>
  <div class="texto">${esc(rep.texto)}</div>`;
  listaEl.prepend(div);
  countEl.textContent = listaEl.children.length;
}

function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

socket.on('connect', conectar);
socket.on('nuevo-reporte', (rep) => {
  if(rep.codigo !== CODIGO) return;
  if([...listaEl.children].some(c => c.dataset.id === rep.id)) return;
  pintarConId(rep, true);
  estadoEl.textContent = '📩 Nuevo reporte de ' + rep.maquina + ' a las ' + rep.fechaHora;
  try{ new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); }catch{}
  if(Notification.permission === 'granted') new Notification('Nuevo reporte: ' + rep.maquina, { body: rep.texto.slice(0,120) });
});
if(Notification.permission === 'default') Notification.requestPermission();

document.getElementById('exportar').onclick = async () => {
  const r = await fetch('/api/reportes/' + encodeURIComponent(CODIGO));
  const data = await r.json();
  if(!data.length){ alert('No hay reportes'); return; }
  const csv = 'fecha;maquina;operario;texto\n' + data.map(x=>`"${x.fechaHora}";"${x.maquina.replace(/"/g,'""')}";"${x.operario.replace(/"/g,'""')}";"${x.texto.replace(/"/g,'""').replace(/\n/g,' ')}"`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv],{type:'text/csv'}));
  a.download = 'reportes-'+CODIGO+'.csv'; a.click();
};
document.getElementById('qr').onclick = () => {
  const url = location.origin + '/movil.html';
  const d = document.getElementById('linkMovil');
  d.style.display = 'block';
  d.innerHTML = `En el celular Android (Chrome) abre: <b>${url}</b><br>Y escribe el código: <b>${CODIGO}</b><br><br>📱 Para micrófono usa SIEMPRE la versión <b>https con puerto 3443</b>:<br><b>https://192.168.1.2:3443/movil.html</b>`;
};
conectar();
setInterval(cargarHistorial, 5000);
</script>
</body>
</html>
