name: Build Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'electron/**', 'server.js', 'package.json']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: reportes-maquinas-pc-setup
          path: dist/*.exe
